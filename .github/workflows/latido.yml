# Mantiene despierta la base gratis de Supabase (se pausa tras ~7 días sin uso)
# y deja una marca mensual en el repo para que GitHub no apague este horario.
name: Latido de Supabase

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tienda
        run: |
          curl -fsS "https://rmtrqylnuolvtregepuq.supabase.co/rest/v1/productos?select=id&limit=1" \
            -H "apikey: sb_publishable_9Lz7Hviwnt1eBr5LjEIFwg_aXL25avr" > /dev/null
          echo "Supabase respondió"
      - uses: actions/checkout@v4
      - name: Marca mensual
        run: |
          if [ "$(date +%d)" -le 03 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"%Y-%m-%dT%H:%MZ" > .github/latido.txt
            git config user.name "latido-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/latido.txt
            git commit -m "Latido mensual" && git push || echo "Sin cambios"
          fi
