<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar contraseña · Cosas Perdidas</title>
  <link rel="icon" href="img/flor.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tienda.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .entrada-caja { width: min(100%, 28rem); }
    form { display: grid; gap: .8rem; margin: 1rem 0; }
    label { display: grid; gap: .35rem; }
    form input { width: 100%; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section class="entrada-caja" aria-labelledby="titulo">
      <h1 id="titulo">Recuperar contraseña</h1>
      <form id="solicitud" hidden>
        <label>Correo electrónico
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <button type="submit">Enviar enlace</button>
      </form>
      <form id="cambio" hidden>
        <label>Nueva contraseña
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>Confirma la contraseña
          <input name="confirmacion" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Guardar contraseña</button>
      </form>
      <p id="estado" role="status">Cargando…</p>
      <a href="admin.html">Volver al panel</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    (() => {
      'use strict';
      const solicitud = document.getElementById('solicitud');
      const cambio = document.getElementById('cambio');
      const titulo = document.getElementById('titulo');
      const estado = document.getElementById('estado');
      const fragmento = new URLSearchParams(location.hash.slice(1));
      const errorEnlace = fragmento.has('error') || new URLSearchParams(location.search).has('error');
      const recuperar = fragmento.get('type') === 'recovery';
      const destino = new URL('recuperar.html', location.href).href;
      let sesionRecuperada = false;
      const config = window.CP_CONFIG;

      if (!window.supabase || !config?.SUPABASE_URL || !config?.SUPABASE_ANON_KEY) {
        estado.textContent = 'El servicio de recuperación no está disponible.';
        return;
      }

      const auth = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, flowType: 'implicit' }
      }).auth;

      auth.onAuthStateChange((evento, sesion) => {
        if (evento !== 'PASSWORD_RECOVERY' || !recuperar || !sesion) return;
        sesionRecuperada = true;
        titulo.textContent = 'Elige una contraseña nueva';
        solicitud.hidden = true;
        cambio.hidden = false;
        estado.textContent = '';
        cambio.elements.password.focus();
      });

      auth.getSession().then(({ data, error }) => {
        if (sesionRecuperada) return;
        if (recuperar && data?.session && !error) return;
        if (errorEnlace || recuperar || error) {
          history.replaceState(null, '', destino);
          estado.textContent = 'El enlace no es válido o venció. Pide uno nuevo.';
        } else {
          estado.textContent = '';
        }
        solicitud.hidden = false;
      }).catch(() => {
        estado.textContent = 'No se pudo abrir la recuperación. Recarga la página e inténtalo de nuevo.';
      });

      solicitud.addEventListener('submit', async evento => {
        evento.preventDefault();
        const boton = solicitud.querySelector('button');
        boton.disabled = true;
        try {
          const { error } = await auth.resetPasswordForEmail(solicitud.elements.email.value.trim(), {
            redirectTo: destino
          });
          estado.textContent = error
            ? 'No se pudo solicitar el enlace. Espera un momento e inténtalo de nuevo.'
            : 'Si el correo está registrado, recibirás un enlace para cambiar la contraseña.';
        } catch {
          estado.textContent = 'No se pudo solicitar el enlace. Inténtalo de nuevo.';
        } finally {
          boton.disabled = false;
        }
      });

      cambio.addEventListener('submit', async evento => {
        evento.preventDefault();
        if (!sesionRecuperada) return;
        const { password, confirmacion } = cambio.elements;
        if (password.value !== confirmacion.value) {
          estado.textContent = 'Las contraseñas deben coincidir.';
          confirmacion.focus();
          return;
        }
        const boton = cambio.querySelector('button');
        boton.disabled = true;
        try {
          const { error } = await auth.updateUser({ password: password.value });
          if (error) {
            estado.textContent = 'Supabase no pudo guardar la contraseña. Prueba una más larga o solicita un enlace nuevo.';
            return;
          }
          sesionRecuperada = false;
          cambio.reset();
          cambio.hidden = true;
          titulo.textContent = 'Contraseña actualizada';
          estado.textContent = 'Ya puedes volver al panel e iniciar sesión con la contraseña nueva.';
        } catch {
          estado.textContent = 'No se pudo confirmar el cambio. Inténtalo de nuevo.';
        } finally {
          boton.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
